<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harmonia · Account</title><script src="/config.js"></script><script src="/shared/identity.js?v=20260807-role-router"></script><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,sans-serif;background:#071a35;color:#13233a;display:grid;place-items:center;padding:24px}.wrap{width:min(980px,100%);display:grid;grid-template-columns:1fr 440px;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 34px 90px rgba(0,0,0,.28)}.intro{padding:58px;background:linear-gradient(145deg,#0b3d91,#071a35);color:#fff;display:flex;flex-direction:column;justify-content:flex-end}.intro h1{font-size:46px;line-height:1;margin:0 0 14px;letter-spacing:-.04em}.intro p{margin:0;color:#d8e6ff;font-size:17px}.panel{padding:42px}.tabs{display:flex;gap:6px;background:#f0f4f9;padding:5px;border-radius:999px;margin-bottom:26px}.tabs button{flex:1;border:0;background:transparent;border-radius:999px;padding:10px;font-weight:750;color:#59677a;cursor:pointer}.tabs button.active{background:#fff;color:#071a35;box-shadow:0 3px 14px rgba(0,0,0,.08)}form{display:grid;gap:15px}form[hidden]{display:none!important}label{display:grid;gap:6px;font-size:13px;font-weight:700}input{width:100%;padding:13px 14px;border:1px solid #dbe5f1;border-radius:13px;font:inherit}.name{display:grid;grid-template-columns:1fr 1fr;gap:12px}.check{display:flex;align-items:center;gap:8px;font-weight:500}.check input{width:auto}.go{border:0;background:#0b3d91;color:#fff;border-radius:999px;padding:13px 18px;font-weight:800;cursor:pointer}.status{min-height:22px;margin-top:14px;font-size:13px;color:#64748b}.status.error{color:#a21b1b}.back{display:inline-block;margin-top:22px;color:#64748b;text-decoration:none;font-size:13px}@media(max-width:760px){.wrap{grid-template-columns:1fr}.intro{padding:34px}.intro h1{font-size:36px}.panel{padding:30px}.name{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><section class="intro"><h1>Harmonia.</h1><p>Sign in or create an account.</p></section><section class="panel"><div class="tabs"><button id="signInTab" class="active" type="button">Sign in</button><button id="createTab" type="button">Create account</button></div><form id="loginForm"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><label class="check"><input name="remember" type="checkbox" checked>Keep me signed in</label><button class="go">Sign in</button></form><form id="registerForm" hidden><div class="name"><label>First name<input name="firstName" required></label><label>Last name<input name="lastName" required></label></div><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" minlength="8" autocomplete="new-password" required></label><button class="go">Create account</button></form><div id="status" class="status"></div><a class="back" href="/">← Back to Harmonia</a></section></main><script src="/account/account.js?v=20260807-role-router"></script></body></html>
